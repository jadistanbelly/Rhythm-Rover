[project]
name = "rhythm-rover"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "discord.py>=2.6.3,<3",
    "pynacl>=1.6.2,<2",
    "python-dotenv>=1.2.2,<2",
    "yt-dlp[default]>=2026.6.9",
]

[dependency-groups]
dev = [
    "pip-audit>=2.10.1,<3",
    "pytest>=9.0.0,<10",
    "ruff>=0.15.17,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["bot", "disc_functions", "py_functions", "variables"]
